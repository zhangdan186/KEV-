[project]
name = "kev-analysis-course-project"
version = "1.0.0"
description = "Frozen development contracts for CISA KEV course project"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "matplotlib>=3.8,<4.0",
  "plotly>=5.20,<7.0",
  "streamlit>=1.35,<2.0",
  "scikit-learn>=1.4,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "pandas-stubs>=2.2,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
